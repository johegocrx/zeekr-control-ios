# ============================================
# XcodeGen project spec para Zeekr Control iOS
# ============================================
name: ZeekrControl
options:
  bundleIdPrefix: com.zeekrcontrol
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.zeekrcontrol.app
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  ZeekrControl:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ZeekrControl
    info:
      path: ZeekrControl/Info.plist
      properties:
        CFBundleDisplayName: Zeekr Control
        CFBundleIdentifier: com.zeekrcontrol.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        NSBluetoothAlwaysUsageDescription: "Zeekr Control utiliza Bluetooth LE para comunicarse directamente con el vehículo Zeekr 7X."
        NSBluetoothPeripheralUsageDescription: "Zeekr Control utiliza Bluetooth LE para controlar las funciones del vehículo."
        NSLocalNetworkUsageDescription: "Zeekr Control se comunica con el servidor local del vehículo en la red Wi-Fi."
        UIBackgroundModes:
          - bluetooth-central
          - fetch
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeekrcontrol.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies: []
